[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiogram-buffered-router"
version = "0.2.0"
description = "Debounced message batching router for aiogram 3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "wprhvso" }]
keywords = ["aiogram", "telegram", "bot", "batching", "debounce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["aiogram>=3.22"]

[project.urls]
Homepage = "https://github.com/wprhvso/aiogram-buffered-router"
Repository = "https://github.com/wprhvso/aiogram-buffered-router"
Issues = "https://github.com/wprhvso/aiogram-buffered-router/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiogram_buffered_router"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

