name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: nested
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, format, pyright, pytest]
    steps:
      - uses: actions/checkout@v7
      - uses: wprhvso/qa-python@v1
        with:
          checks: ${{ matrix.check }}
          coverage-fail-under: "95"

  build:
    runs-on: nested
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
